[meta]
fiscal_year = 2025
source_decision_file = "docs/maintenance/tax/decision_points/2025.md"
last_verified = "2026-05-26"

[countries.PT]
# DP-001: Loan repayment disposals are not taxable events under PT law.
# Legal basis: CIRS art. 10(20) — returning borrowed crypto is not "alienação onerosa".
exclude_loan_repayment_gains = true

# DP-010: Futures and derivatives liquidations are taxable events under PT law.
# Legal basis: CIRS art. 10(1)(e) covers "instrumentos financeiros derivados".
# A liquidation is treated as alienação onerosa (disposal), not as a withdrawal.
# Losses follow the same rules as other capital losses:
#   - Short-term (<365 days): can be carried forward for 5 years (PT-C-016)
#   - Long-term (≥365 days): both gains and losses are excluded (CIRS art. 10(19))
futures_derivatives_taxable = true

# DP-011: For futures and derivatives, use Koinly Other Gains Report values
# rather than Capital Gains Report when available.
# Legal basis: CIRS art. 10(1)(e) for derivatives; OGR provides more granular
# Type classification (Profit/Loss) and better handling of collateral flow.
# Interaction with DP-010: DP-010 says derivatives are taxable; DP-011 specifies
# which Koinly report carries the authoritative value when both are present.
# When OGR overrides CG: futures/derivatives with Type="Loss" or Type="Profit"
use_other_gains_report = true

# DP-012: Separate derivatives P&L from spot crypto in the report.
# Legal basis: CIRS art. 10(1)(e) covers "instrumentos financeiros derivados"
# (no 365-day exemption) vs art. 10(1)(k) for other crypto-assets (365-day
# exemption under art. 10(19)). AT binding ruling 28298/2025 confirms derivatives
# are reported under art. 10(1)(e); spot retains art. 10(1)(k).
separate_derivatives_reporting = true

# DP-017: Route derivatives P&L to the Modelo 3 annex/operation code dictated by
# counterparty residency (per AT binding ruling Processo 28298/2025 and CIRS
# art. 10(1)(e)). When True the resolver gates on `operator_country == country`:
# resident counterparty -> Anexo G Quadro 13, code G51; non-resident counterparty
# (the usual case for foreign exchanges such as ByBit/Binance/OKX) or UNKNOWN/empty
# -> Anexo J Quadro 9.2.B, code G30. NOT Quadro 9.4 (which is spot crypto, art.
# 10(1)(k)). When False the route and code resolve to blank.
route_derivatives_by_counterparty_residency = true

# DP-018: Classify crypto reward income with the Modelo 3 income codes from
# Tabela V. When True the resolver assigns the official code for the reward
# family (E25 for the interest/lending family); all other reward types resolve
# to blank. When False every reward income code resolves to blank.
classify_rewards_with_income_codes = true

# DP-014: Infer the realization value (valor de realização) of Koinly-tagged
# Payment/Card Payment disposals whose CG proceeds_eur == 0 because Koinly's
# price DB had no match for the imported ticker (a typical root cause is a
# token-rename alias, e.g. the 1:1 EUR-pegged Circle stablecoin that launched
# in 2022 as EUROC and was renamed to the canonical EURC; Koinly still holds
# the old EUROC label, which its price DB no longer matches).
# Legal basis: PT-C-004 (a goods/services purchase paid in crypto is a taxable
# alienação onerosa - the disposal stays taxable; this corrects the realization
# value, it does NOT exclude the event) and PT-C-007 (the realization value
# equals the fair market value of the crypto spent).
# Resolution is three-tier: (1) primary - trust Koinly's own TH
# Net Value (EUR) when present (works for any asset Koinly prices, including
# USD-pegged stablecoins); (2) stablecoin fallback when Net Value == 0 - EUR
# par for configured EUR-pegged stablecoins (EURC/EUROC/EURT), or the fiscal
# year-end peg->EUR rate conversion for non-EUR-pegged stablecoins whose peg
# currency has an [EXCHANGE RATES] rate (the same source shares/dividends use);
# both fallbacks set review_required=True (approximations of the disposal-date
# FMV); (3) review flag for non-EUR stablecoins whose peg has no config rate
# and for non-stablecoins (leave proceeds=0, advise the user to check the
# ticker mapping in Koinly). Stablecoin membership + peg annotation are reused
# from docs/maintenance/tax/popular_crypto_tokens.json (tokens.stablecoins,
# stablecoin_pegs); payment tag routing lives in TreatmentConfig.payment_tags
# (application/crypto/treatment_resolver.py); no new config file.
# Out of scope: LP-token unstaking (distinct DP-005 non-taxable-deferred
# treatment, tracked follow-up that will reuse the CG<->TH correlation).
infer_payment_proceeds = true

# DP-015: Filter standalone transaction/network fee disposals out of the
# capital gains worksheets. Koinly tags network/gas fees with `Cost` or
# `Loan fee`; under PT law a standalone transaction fee is a non-taxable
# utility cost without received consideration.
# Legal basis: CIRS art. 10(1)(k) - a standalone network/transaction fee is
# not an alienação onerosa (no consideration is received), so Koinly's
# default realization of gains on the fee token must be filtered out.
# TWO identification paths (both gated by a TxHash co-occurrence guard: the
# fee event's non-empty TxHash must appear >= 2 times in the TH CSV, so
# standalone service payments remain taxable. EXCEPTION: events whose tag is
# `Cost` or `Loan fee` bypass the TxHash guard, treating embedded exchange
# and transfer fees as standalone without requiring multiple TH rows):
#   1. Tagged: any crypto_withdrawal tagged `Cost` or `Loan fee` - the explicit
#      tag is trusted, no EUR amount threshold is applied. Removed.
#   2. Untagged-whitelist: an untagged crypto_withdrawal whose Sent Currency
#      is a key in `layer_1_major_chains` (from popular_crypto_tokens.json)
#      AND whose TH Net Value (EUR) is <= the default 0.5 EUR fallback OR
#      its explicit ceiling in `exclude_transaction_fee_max_eur_per_asset`.
#      Removed. The per-token ceilings are ETH = 1.0 (ETH gas can reach
#      ~0.70 EUR) and BERA = 0.1, with all other whitelisted assets using
#      the default 0.5 EUR.
# Unlisted-asset surfacing (NOT removed): an untagged, TxHash-co-occurring
# crypto_withdrawal whose asset is NOT in the whitelist AND whose Net Value
# (EUR) <= the default ceiling (0.5 EUR) is a *suspect* - it stays taxable
# but is surfaced via a Crypto Gains review flag (red "YES: <reason>" row),
# a Crypto Supplementary "Review required" row, and a log WARNING, so
# legitimate gas tokens missing from the config can be discovered and added.
exclude_transaction_fees = true
exclude_transaction_fee_default_max_eur = 0.5

# DP-015 per-token EUR ceilings for the untagged-whitelist path. Keys are the
# explicit overrides for assets that need a higher or lower ceiling than the
# default 0.5 EUR fallback.
[countries.PT.exclude_transaction_fee_max_eur_per_asset]
ETH = 1.0
BERA = 0.1

[countries.US]
exclude_loan_repayment_gains = false
