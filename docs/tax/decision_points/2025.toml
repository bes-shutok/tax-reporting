[meta]
fiscal_year = 2025
source_decision_file = "docs/tax/decision_points/2025.md"
last_verified = "2026-05-26"

[countries.PT]
# DP-001: Loan repayment disposals are not taxable events under PT law.
# Legal basis: CIRS art. 10(20) — returning borrowed crypto is not "alienação onerosa".
exclude_loan_repayment_gains = true

# DP-010: Futures and derivatives liquidations are taxable events under PT law.
# Legal basis: CIRS art. 10(1)(e) covers "instrumentos financeiros derivados".
# A liquidation is treated as alienação onerosa (disposal), not as a withdrawal.
# Losses follow the same rules as other capital losses:
#   - Short-term (<365 days): can be carried forward for 5 years (PT-C-016)
#   - Long-term (≥365 days): both gains and losses are excluded (CIRS art. 10(19))
futures_derivatives_taxable = true

# DP-011: For futures and derivatives, use Koinly Other Gains Report values
# rather than Capital Gains Report when available.
# Legal basis: CIRS art. 10(1)(e) for derivatives; OGR provides more granular
# Type classification (Profit/Loss) and better handling of collateral flow.
# Interaction with DP-010: DP-010 says derivatives are taxable; DP-011 specifies
# which Koinly report carries the authoritative value when both are present.
# When OGR overrides CG: futures/derivatives with Type="Loss" or Type="Profit"
use_other_gains_report = true

# DP-012: Separate derivatives P&L from spot crypto in the report.
# Legal basis: CIRS art. 10(1)(e) covers "instrumentos financeiros derivados"
# (no 365-day exemption) vs art. 10(1)(k) for other crypto-assets (365-day
# exemption under art. 10(19)). AT binding ruling 28298/2025 confirms derivatives
# are reported under art. 10(1)(e); spot retains art. 10(1)(k).
separate_derivatives_reporting = true

[countries.US]
exclude_loan_repayment_gains = false
