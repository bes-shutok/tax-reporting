[COMMON]
TARGET CURRENCY = EUR
; Console handler minimum log level (DEBUG/INFO/WARNING/ERROR/CRITICAL, case-insensitive).
; CLI --log-level overrides this. The file handler always captures DEBUG (audit trail).
LOG_LEVEL = WARNING

[EXCHANGE RATES]
EUR/CAD = 0.62158
EUR/USD = 0.85106
EUR/GBP = 1.14600
EUR/HKD = 0.10933


[EXCHANGE RATES 2024]
EUR/CAD = 0.66899
EUR/USD = 0.96256
EUR/GBP = 1.20601
EUR/HKD = 0.12394
EUR/PLN = 0.23392

[TAX JURISDICTION]
TAX_COUNTRY = PT
FISCAL_YEAR = 2025
ZERO_BASIS_REVIEW_THRESHOLD = 50
ZERO_BASIS_REVIEW_MIN_PROCEEDS = 10
; IANA timezone used to localize naive Koinly dates (CG/OGR/Income are
; mainland-Portugal local time, WET/WEST) to UTC at ingestion. Auto-deducted to
; Europe/Lisbon for TAX_COUNTRY=PT; REQUIRED for other countries when crypto data
; is present (crypto processing fails fast with ConfigurationError if it cannot
; resolve a timezone, rather than silently treating naive dates as UTC).
; IANA_TIMEZONE = Europe/Lisbon
