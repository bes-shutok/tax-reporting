; IANA timezone used to localize naive Koinly dates (CG/OGR/Income are
; mainland-Portugal local time, WET/WEST) to UTC at ingestion. Auto-deducted to
; Europe/Lisbon for TAX_COUNTRY=PT; REQUIRED for other countries when crypto data
; is present (crypto processing fails fast with ConfigurationError if it cannot
; resolve a timezone, rather than silently treating naive dates as UTC).
; IANA_TIMEZONE = Europe/Lisbon
